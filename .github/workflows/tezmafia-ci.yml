name: TezMafia CI

on:
  push:
    branches: [main]
    paths:
      - "tezmafia/**"
      - ".github/workflows/tezmafia-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "tezmafia/**"
      - ".github/workflows/tezmafia-ci.yml"

concurrency:
  group: tezmafia-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest + QA gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tezmafia
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install package
        run: pip install -e ".[dev]"

      - name: ruff
        run: ruff check tezmafia tests scripts

      - name: pytest
        env:
          BOT_TOKEN: "0000000000:AAFakeTokenForCiOnlyNotReal"
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
        run: pytest -q --tb=short

      - name: QA gate (100 tickets)
        env:
          BOT_TOKEN: "0000000000:AAFakeTokenForCiOnlyNotReal"
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
        run: python -m tezmafia.qa_gate

  # The production PC still runs a 3.12 virtualenv (.venv-win); keep the suite green on that interpreter too.
  # Deliberately a separate job with a different name: autodeploy keys on the "pytest + QA gate" check only.
  test-py312:
    name: pytest (Python 3.12, production interpreter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tezmafia
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tezmafia/pyproject.toml

      - name: Install package
        run: pip install -e ".[dev]"

      - name: pytest
        env:
          BOT_TOKEN: "0000000000:AAFakeTokenForCiOnlyNotReal"
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
        run: pytest -q --tb=short
