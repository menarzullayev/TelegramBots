name: TezMafia CI

on:
  push:
    branches: [main]
    paths:
      - "tezmafia/**"
      - ".github/workflows/tezmafia-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "tezmafia/**"
      - ".github/workflows/tezmafia-ci.yml"

concurrency:
  group: tezmafia-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest + QA gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tezmafia
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tezmafia/pyproject.toml

      - name: Install package
        run: pip install -e ".[dev]"

      - name: pytest
        env:
          BOT_TOKEN: "0000000000:AAFakeTokenForCiOnlyNotReal"
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
        run: pytest -q --tb=short

      - name: QA gate (100 tickets)
        env:
          BOT_TOKEN: "0000000000:AAFakeTokenForCiOnlyNotReal"
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
        run: python -m tezmafia.qa_gate
