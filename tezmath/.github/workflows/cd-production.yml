name: Deploy to Production

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  deploy:
    name: Deploy Production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set version tag
        id: version
        run: |
          echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build and push all services
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for service in bot-gateway ai-solver renderer payment notification admin-panel; do
            docker build "services/$service" \
              -t "tezmath/$service:$VERSION" \
              -t "tezmath/$service:latest"
            docker push "tezmath/$service:$VERSION"
            docker push "tezmath/$service:latest"
          done

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/tezmath
            docker compose pull
            docker compose up -d --remove-orphans
            docker system prune -f
