name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev tools
        run: pip install ruff mypy

      - name: Ruff lint
        run: ruff check services/

      - name: Ruff format check
        run: ruff format --check services/

  test-bot-gateway:
    name: Test bot-gateway
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tezmath_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports: ["6379:6379"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r services/bot-gateway/requirements.txt pytest pytest-asyncio pytest-cov

      - name: Run migrations
        run: psql postgresql://postgres:postgres@localhost:5432/tezmath_test -f database/migrations/001_initial.sql

      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tezmath_test
          REDIS_URL: redis://localhost:6379
          BOT_TOKEN: fake_token_for_testing
          RABBITMQ_URL: amqp://guest:guest@localhost:5672/
          ANTHROPIC_API_KEY: fake_key
          WEBHOOK_SECRET: test_secret
          INTERNAL_API_KEY: test_internal_key
        run: |
          cd services/bot-gateway
          python -m pytest tests/ -v --cov=src --cov-report=xml

      - uses: codecov/codecov-action@v4
        with:
          file: services/bot-gateway/coverage.xml

  test-ai-solver:
    name: Test ai-solver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r services/ai-solver/requirements.txt pytest pytest-asyncio
      - name: Run tests
        env:
          ANTHROPIC_API_KEY: fake_key
          RABBITMQ_URL: amqp://guest:guest@localhost:5672/
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tezmath_test
          REDIS_URL: redis://localhost:6379
        run: |
          cd services/ai-solver
          python -m pytest tests/ -v

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [bot-gateway, ai-solver, renderer, payment, notification, admin-panel]
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.service }}
        run: docker build "services/${{ matrix.service }}" -t "tezmath/${{ matrix.service }}:ci"
