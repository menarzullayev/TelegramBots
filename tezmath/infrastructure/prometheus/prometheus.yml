global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - "alerts/*.yml"

scrape_configs:
  - job_name: "bot-gateway"
    static_configs:
      - targets: ["bot-gateway:8000"]
    metrics_path: /metrics

  - job_name: "ai-solver"
    static_configs:
      - targets: ["ai-solver:9090"]

  - job_name: "payment"
    static_configs:
      - targets: ["payment:8002"]
    metrics_path: /metrics

  - job_name: "renderer"
    static_configs:
      - targets: ["renderer:8001"]
    metrics_path: /metrics

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: "rabbitmq"
    static_configs:
      - targets: ["rabbitmq:15692"]
