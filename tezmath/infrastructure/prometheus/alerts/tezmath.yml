groups:
  - name: tezmath
    rules:
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High error rate on {{ $labels.job }}"
          description: "Error rate {{ $value | humanizePercentage }} over last 5 minutes"

      - alert: SolverQueueDepth
        expr: rabbitmq_queue_messages{queue="solver.tasks"} > 100
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Solver queue is backing up"
          description: "{{ $value }} messages pending in solver.tasks"

      - alert: DatabaseConnections
        expr: pg_stat_activity_count > 80
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High DB connection count"

      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"
