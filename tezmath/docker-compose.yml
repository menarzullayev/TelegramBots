version: "3.9"

services:
  # ── Bot Gateway ──────────────────────────────────────────
  bot-gateway:
    build: ./services/bot-gateway
    restart: unless-stopped
    env_file: .env
    depends_on:
      - postgres
      - redis
      - rabbitmq
    networks: [tezmath]

  # ── AI Solver ────────────────────────────────────────────
  ai-solver:
    build: ./services/ai-solver
    restart: unless-stopped
    env_file: .env
    depends_on:
      - rabbitmq
      - redis
    networks: [tezmath]

  # ── Renderer ─────────────────────────────────────────────
  renderer:
    build: ./services/renderer
    restart: unless-stopped
    env_file: .env
    depends_on:
      - rabbitmq
      - minio
    networks: [tezmath]

  # ── Payment ──────────────────────────────────────────────
  payment:
    build: ./services/payment
    restart: unless-stopped
    env_file: .env
    ports: ["8001:8001"]
    depends_on:
      - postgres
      - redis
    networks: [tezmath]

  # ── Notification ─────────────────────────────────────────
  notification:
    build: ./services/notification
    restart: unless-stopped
    env_file: .env
    depends_on:
      - rabbitmq
      - postgres
    networks: [tezmath]

  # ── Admin Panel ──────────────────────────────────────────
  admin-panel:
    build: ./services/admin-panel/backend
    restart: unless-stopped
    env_file: .env
    ports: ["8002:8002"]
    depends_on:
      - postgres
      - redis
    networks: [tezmath]

  # ── Infrastructure ───────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tezmath
      POSTGRES_USER: tezmath
      POSTGRES_PASSWORD: password
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks: [tezmath]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass password
    volumes:
      - redis_data:/data
    networks: [tezmath]

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: tezmath
      RABBITMQ_DEFAULT_PASS: password
    volumes:
      - rabbit_data:/var/lib/rabbitmq
    networks: [tezmath]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    networks: [tezmath]

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - bot-gateway
      - payment
      - admin-panel
    networks: [tezmath]

volumes:
  pg_data:
  redis_data:
  rabbit_data:
  minio_data:

networks:
  tezmath:
    driver: bridge
