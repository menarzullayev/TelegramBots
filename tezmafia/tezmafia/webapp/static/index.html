<script>
/* Applies the remembered theme before first paint (no flash). Fonts are self-hosted @font-face rules below. */
window.TM_THEMES = {
  dossier: { bar: "#101116", bottom: "#1A1C23" },
  neon: { bar: "#07050F", bottom: "#0B0818" },
  deco: { bar: "#0A0908", bottom: "#0D0B08" },
  day: { bar: "#EEF1F6", bottom: "#FFFFFF" },
  comic: { bar: "#E9E5D8", bottom: "#000000" }
};
window.tmTheme = function (id) {
  var t = window.TM_THEMES[id];
  if (!t) return false;
  document.documentElement.setAttribute("data-theme", id);
  try { localStorage.setItem("tm_theme", id); } catch (e) { /* storage may be blocked */ }
  return true;
};
try { window.tmTheme(localStorage.getItem("tm_theme") || "dossier"); } catch (e) { window.tmTheme("dossier"); }

/* Start /api/state before any other script is parsed. Telegram puts the signed initData into the URL hash
   (tgWebAppData=...), the same value Telegram.WebApp.initData returns. No hash: the main script falls back to the SDK. */
window.tmFetch = function (initData) {
  return fetch("/api/state", { headers: { "Authorization": "tma " + initData } })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); });
};
try {
  var early = new URLSearchParams(location.hash.slice(1)).get("tgWebAppData");
  if (early) { window.tmInit = early; window.tmState = window.tmFetch(early); window.tmState.catch(function () {}); }
} catch (e) { /* the main script retries */ }
window.tmTg = new Promise(function (done) { window.tmTgDone = done; }); /* resolves when the Telegram SDK loaded or failed */
</script>

  /* Themes: every colour, font, border and ornament below is a token; each [data-theme] block only overrides tokens
     and adds its own decoration. "dossier" (the case file: ivory paper on a dark desk) is the default. */
  :root {
    --desk: #101116;
    --folder: #1A1C23;
    --folder-edge: #2A2C35;

    --page-bg:
      radial-gradient(120% 60% at 50% -10%, rgba(114, 31, 43, .28), transparent 60%),

    --card-r: 3px;

    --card-img: repeating-linear-gradient(transparent 0 31px, rgba(34, 32, 28, .055) 31px 32px);
    --h-tt: none; --h-ls: normal; --h-w: 700; --h-align: left;
    --line: rgba(34, 32, 28, .2);
    --line-soft: rgba(34, 32, 28, .14);
    --ctl-bd: rgba(34, 32, 28, .35);
    --btn-bg: var(--ink); --btn-fg: var(--paper); --btn-r: 3px; --btn-shadow: none; --btn-tt: none; --btn-ls: normal;
    --btn-font: var(--type);
    --chosen: var(--burgundy);
    --xp-on: var(--ink); --xp-off: rgba(34, 32, 28, .14); --xp-r: 0;
    --hl: rgba(197, 161, 90, .2);
    --rank: var(--burgundy); --rank-top: var(--stamp);

  * { box-sizing: border-box; }
  html { background: var(--desk); }
  body {
    margin: 0; min-height: 100vh; color: var(--text); font: 17px/1.5 var(--serif);
    background: var(--page-bg);
    padding: calc(14px + env(safe-area-inset-top)) 16px calc(var(--nav-h) + 26px + env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  /* desk header: the folder tab with the case number */
  .folder-tab {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    font-family: var(--type); font-size: 13px; color: var(--ash); margin: 0 4px 12px;
  }
  .folder-tab strong { font-family: var(--head); font-size: 21px; color: var(--text); }

  section { display: none; }
  section.on { display: block; }

  /* a sheet: paper with faint ruled lines, a glass panel, a gold-framed card or a comic panel */
  .sheet {
    position: relative; background: var(--paper); color: var(--ink); border-radius: var(--card-r); border: var(--card-bd);
    padding: 22px 20px 20px; margin: 0 0 18px;
    box-shadow: var(--card-shadow);
    background-image: var(--card-img);
  }
  .sheet h2 { font-family: var(--head); font-weight: var(--h-w); font-size: 24px; line-height: 1.15; margin: 0 0 12px; text-transform: var(--h-tt); letter-spacing: var(--h-ls); text-align: var(--h-align); }
  .sheet h3 { font-family: var(--head); font-weight: var(--h-w); font-size: 19px; line-height: 1.2; margin: 18px 0 8px; text-transform: var(--h-tt); letter-spacing: var(--h-ls); text-align: var(--h-align); }
  .sheet p { margin: 0 0 10px; }
  .note { font-family: var(--type); font-size: 13px; color: var(--ink-soft); }

  /* the dossier: a clipped photo, typed fields and one stamp */
  .dossier { display: grid; grid-template-columns: 112px 1fr; gap: 16px; align-items: start; min-height: 250px; }
  .photo { position: relative; transform: rotate(var(--photo-rot)); }
  .photo img { width: 112px; height: 140px; object-fit: cover; display: block; border: var(--photo-bd); border-radius: var(--photo-r); box-shadow: var(--photo-shadow); filter: var(--img-filter); }
  .photo::before {
    content: ""; position: absolute; top: -12px; left: 40px; width: 16px; height: 38px; border: 3px solid #8b8f99;
    border-radius: 10px; border-bottom-color: transparent; z-index: 2; display: var(--clip);
  }
  .fields { display: grid; gap: 9px; margin: 0; min-width: 0; }
  .field dt { font-family: var(--type); font-size: 12px; color: var(--ink-soft); }
  .field dd { margin: 0; font-family: var(--type); font-size: 15px; overflow-wrap: anywhere; }
  .field dd.big { font-family: var(--head); font-size: 22px; font-weight: var(--h-w); line-height: 1.15; }
  .xp { display: flex; gap: 3px; margin-top: 5px; }
  .xp i { flex: 1; height: 8px; background: var(--xp-off); border-radius: var(--xp-r); }
  .xp i.on { background: var(--xp-on); }
  .stamp {
    position: absolute; left: 34px; bottom: 22px; transform: rotate(var(--stamp-rot)); pointer-events: none;
    font-family: var(--type); font-size: 12px; color: var(--stamp); border: var(--stamp-bd); border-radius: var(--stamp-r);
    padding: 4px 8px; opacity: .9; text-align: center; line-height: 1.15; z-index: 3; background: var(--stamp-bg); box-shadow: var(--stamp-shadow);
  }
  .stamp b { display: block; font-family: var(--head); font-size: 26px; }
  .stamp.hit { animation: stamp .42s cubic-bezier(.2, 1.6, .4, 1) .3s both; }
  @keyframes stamp { from { transform: rotate(var(--stamp-rot)) scale(2.4); opacity: 0; } to { transform: rotate(var(--stamp-rot)) scale(1); opacity: .9; } }

  /* buttons: a primary action and a quiet outlined one */
  .act {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; border-radius: var(--btn-r); padding: 13px 14px; margin: 8px 0 0;
    background: var(--btn-bg); color: var(--btn-fg); font-family: var(--btn-font); font-size: 15px; box-shadow: var(--btn-shadow);
    text-transform: var(--btn-tt); letter-spacing: var(--btn-ls);
  }
  .act.quiet { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ctl-bd); }
  .act.chosen { background: transparent; box-shadow: inset 0 0 0 2px var(--chosen); color: var(--chosen); }
  .act:active { transform: translateY(1px); }

  /* quests: a typed checklist */
  .task { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--line); font-family: var(--type); font-size: 14px; }
  .box { width: 18px; height: 18px; border: 1.5px solid var(--ink); display: grid; place-items: center; line-height: 1; }
  .box .i { --icon: 13px; --icon-sw: 3; }
  .task.done .box { background: var(--ink); color: var(--paper); }
  .task.done .what { text-decoration: line-through; color: var(--ink-soft); }

  /* achievements: wax seals */
  .seals { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 14px 10px; }
  .seal { text-align: center; font-size: 13px; line-height: 1.25; }
  .seal::before {
    content: ""; display: block; width: 46px; height: 46px; margin: 0 auto 6px; border-radius: 50%;
    background: var(--seal-bg); box-shadow: var(--seal-shadow); clip-path: var(--seal-clip);
  }
  .seal.off { color: var(--ink-soft); }
  .seal.off::before { background: var(--seal-off-bg); border: var(--seal-off-bd); box-shadow: none; }

  /* role index cards */
  .intro { font-family: var(--type); font-size: 13px; color: var(--ash); margin: 0 4px 14px; }
  .roles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .role { background: var(--paper); color: var(--ink); border: 0; padding: 0 0 10px; border-radius: var(--card-r); text-align: left; overflow: hidden; box-shadow: var(--role-shadow); }
  .role img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: var(--folder); filter: var(--img-filter); }
  .role span { display: block; padding: 8px 10px 0; font-family: var(--head); font-weight: var(--h-w); font-size: 17px; line-height: 1.2; }
  .role small { display: block; padding: 2px 10px 0; font-family: var(--type); font-size: 12px; color: var(--ink-soft); }
  .role.side-mafia small { color: var(--stamp); }
  dialog { border: 0; padding: 0; background: transparent; max-width: min(92vw, 460px); width: 100%; }
  dialog::backdrop { background: var(--backdrop); }
  dialog .sheet { margin: 0; max-height: 84vh; overflow: auto; }
  dialog img { width: 100%; display: block; margin: 0 0 14px; filter: var(--img-filter); }

  /* wanted board */
  .seg { display: flex; gap: 8px; margin: 0 0 14px; }
  .seg button { flex: 1; border: 0; padding: 10px; border-radius: var(--btn-r); background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ctl-bd); font-family: var(--type); font-size: 14px; }
  .seg button[aria-pressed="true"] { background: var(--btn-bg); color: var(--btn-fg); box-shadow: none; }
  ol.board { list-style: none; margin: 0; padding: 0; counter-reset: rank; }
  ol.board li { counter-increment: rank; display: grid; grid-template-columns: 34px 1fr auto; gap: 8px; align-items: baseline; padding: 9px 4px; border-bottom: 1px solid var(--line-soft); }
  ol.board li::before { content: counter(rank); font-family: var(--head); font-weight: 700; font-size: 20px; color: var(--rank); }
  ol.board li:nth-child(-n+3)::before { color: var(--rank-top); }
  ol.board li.me { background: var(--hl); }
  ol.board .who { overflow-wrap: anywhere; }
  ol.board .val { font-family: var(--type); font-size: 14px; color: var(--ink-soft); white-space: nowrap; }

  /* case log */
  .entry header { display: flex; justify-content: space-between; gap: 10px; font-family: var(--type); font-size: 12px; color: var(--ink-soft); margin: 0 0 6px; }
  .entry.won { box-shadow: inset 4px 0 0 var(--gold), var(--card-shadow); }
  .entry ul { list-style: none; margin: 10px 0 0; padding: 0; }
  .entry li { font-family: var(--type); font-size: 13.5px; padding: 6px 0; border-top: 1px dashed var(--line); }

  /* market ledger */
  .ware { display: grid; grid-template-columns: 56px 1fr; gap: 12px; align-items: center; margin: 10px 0 0; }
  .ware img { width: 56px; height: 56px; object-fit: cover; border-radius: 2px; filter: var(--img-filter); }
  .ware .act { margin: 0; }

  /* customize: one swatch per theme, painted in that theme's own colours (inline --pv-* vars) */
  .swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 14px 10px; margin-top: 10px; }
  .swatch { border: 0; background: transparent; padding: 0; text-align: left; color: var(--ink); min-height: 44px; }
  .swatch .pv { position: relative; display: block; height: 78px; border-radius: var(--pv-r); background: var(--pv-bg); border: var(--pv-bd); }
  .swatch .pv i { position: absolute; inset: 10px; background: var(--pv-card); border: var(--pv-cbd); border-radius: var(--pv-cr); box-shadow: var(--pv-csh); }
  .swatch .pv i::before { content: ""; position: absolute; left: 8px; top: 8px; width: 55%; height: 6px; background: var(--pv-ink); border-radius: 2px; }
  .swatch .pv i::after { content: ""; position: absolute; left: 8px; bottom: 8px; width: 34px; height: 10px; background: var(--pv-acc); border-radius: var(--pv-br); }
  .swatch .nm { display: block; margin-top: 7px; font: 700 13px/1.2 var(--type); }
  .swatch[aria-pressed="true"] .pv { outline: 3px solid var(--burgundy); outline-offset: 2px; }
  .swatch .nm { display: flex; align-items: center; gap: 4px; }
  .swatch .ck { display: none; width: 14px; height: 14px; }
  .swatch[aria-pressed="true"] .ck { display: block; }

  /* bottom navigation: folder tabs */
  nav.tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: grid; grid-template-columns: repeat(5, 1fr);
    background: var(--nav-bg); border-top: var(--nav-bd);
    padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); height: calc(var(--nav-h) + env(safe-area-inset-bottom));
  }
  nav.tabs button { border: 0; background: transparent; color: var(--nav-fg); display: grid; justify-items: center; align-content: center; gap: 3px; padding: 4px 2px; border-radius: 6px 6px 0 0; font-family: var(--type); font-size: 11px; }
  nav.tabs .i { --icon: 22px; }
  nav.tabs button[aria-selected="true"] { color: var(--nav-on-fg); background: var(--nav-on-bg); border-radius: var(--nav-on-r); clip-path: var(--nav-on-clip); }
  .err { text-align: center; margin-top: 40px; color: var(--ash); font-family: var(--type); }


  /* icons: one sprite, one stroke style; size and weight are tokens so every theme can tune them */
  .i { width: var(--icon); height: var(--icon); flex: none; fill: none; stroke: currentColor; stroke-width: var(--icon-sw); stroke-linecap: round; stroke-linejoin: round; vertical-align: -.2em; }
  .i.sm { --icon: var(--icon-sm); }
  .i.lg { --icon: var(--icon-lg); }
  .sheet h2 .i { --icon: .9em; margin-right: .4em; vertical-align: -.08em; color: var(--rank); }
  .field dt { display: flex; align-items: center; gap: 6px; }
  .field dt .i { --icon: 14px; color: var(--rank); }
  .with-i { display: inline-flex; align-items: center; gap: 4px; }
  ol.board .val .i { margin: 0 2px; }
  .err { color: var(--ash); }

  /* header: case number and the language button */
  .head-r { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .lang-btn {
    display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 4px 8px; border: 1.5px solid var(--ctl-bd); border-radius: var(--btn-r);
    background: transparent; color: var(--text); font-family: var(--type); font-size: 12px; font-weight: 700; letter-spacing: .04em;
  }
  :root[data-theme="dossier"] .lang-btn { border-color: var(--folder-edge); }
  :root[data-theme="comic"] .lang-btn { border-color: #000; background: #fff; color: #000; box-shadow: 2px 2px 0 #000; }
  :root[data-theme="day"] .lang-btn { background: #fff; border-color: #CBD3E1; }
  .lang-btn .chev { --icon: 14px; transition: transform .15s; }
  .lang-btn[aria-expanded="true"] .chev { transform: rotate(180deg); }
  .flag { width: 22px; height: 15px; flex: none; border-radius: 2px; box-shadow: 0 0 0 1px rgba(128, 128, 128, .45); }
  :root[data-theme="comic"] .flag, :root[data-theme="deco"] .flag { border-radius: 0; }

  /* language sheet: custom listbox, bottom sheet on phones */
  body.lock { overflow: hidden; }
  #langwrap[hidden] { display: none; }
  #langwrap { position: fixed; inset: 0; z-index: 40; }
  .scrim { position: absolute; inset: 0; background: var(--backdrop); }
  .lang-sheet {
    position: absolute; left: 0; right: 0; bottom: 0; max-width: 640px; margin: 0 auto; max-height: 82vh; overflow: auto;
    background: var(--paper); color: var(--ink); border: var(--card-bd); border-radius: calc(var(--card-r) * 2 + 4px) calc(var(--card-r) * 2 + 4px) 0 0;
    box-shadow: var(--card-shadow); padding: 14px 14px calc(14px + env(safe-area-inset-bottom));
  }
  .lang-head { display: flex; align-items: center; justify-content: space-between; margin: 0 4px 6px; }
  .lang-head strong { font-family: var(--head); font-size: 20px; text-transform: var(--h-tt); letter-spacing: var(--h-ls); font-weight: var(--h-w); }
  .lang-x { width: 44px; height: 44px; display: grid; place-items: center; border: 0; background: transparent; color: var(--ink); border-radius: var(--btn-r); }
  #langlist { list-style: none; margin: 0; padding: 0; }
  #langlist [role="option"] {
    display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 8px 10px; border-bottom: 1px solid var(--line-soft);
    font-family: var(--type); font-size: 16px; cursor: pointer; border-radius: calc(var(--btn-r) / 2);
  }
  #langlist [role="option"] .nm { flex: 1; }
  #langlist [role="option"] .ck { visibility: hidden; color: var(--rank); }
  #langlist [role="option"][aria-selected="true"] { background: var(--hl); font-weight: 700; }
  #langlist [role="option"][aria-selected="true"] .ck { visibility: visible; }
  #langlist [role="option"]:focus-visible { outline-offset: -2px; }

  /* skeleton: shown from static HTML until /api/state arrives */
  .sk { display: block; background: var(--line-soft); border-radius: 3px; animation: skp 1.3s ease-in-out infinite; }
  :root[data-theme="neon"] .sk { background: rgba(0, 229, 255, .16); }
  :root[data-theme="deco"] .sk { background: rgba(201, 162, 75, .2); }
  :root[data-theme="comic"] .sk { background: #D5D1C4; }
  .sk-bar { height: 12px; margin: 10px 0; }
  .sk-pill { width: 72px; height: 36px; border-radius: var(--btn-r); }
  .sk-photo { width: 112px; height: 140px; }
  .sk-btn { height: 46px; margin-top: 14px; border-radius: var(--btn-r); }
  .folder-tab .sk { background: var(--folder-edge); }
  :root[data-theme="comic"] .folder-tab .sk { background: #bbb6a6; }
  .skb { display: grid; justify-items: center; align-content: center; gap: 5px; color: var(--nav-fg); }
  .skb .sk-bar { margin: 0; background: currentColor; opacity: .25; animation: none; }
  nav.tabs[aria-hidden="true"] .skb .i { opacity: .55; }
  @keyframes skp { 50% { opacity: .45; } }

  @media (prefers-reduced-motion: reduce) { .stamp.hit, .sk { animation: none; } .lang-btn .chev { transition: none; } }
  @media (min-width: 640px) { body { max-width: 640px; margin: 0 auto; } }
</style>
</head>

<script>
"use strict";
let tg = null, S = null, topView = "season", stamped = false, curTab = "dossier";
const initDataNow = () => (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData) || window.tmInit || "";

const SVGNS = "http://www.w3.org/2000/svg";
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);

    if (v === false || v == null) continue;

/* Small flat flags (3:2) so they look the same on every phone and desktop; decorative, the name carries the meaning. */

  en: '<rect width="30" height="20" fill="#012169"/><path d="M0 0l30 20M30 0 0 20" stroke="#fff" stroke-width="4"/><path d="M0 0l30 20M30 0 0 20" stroke="#C8102E" stroke-width="1.5"/><path d="M15 0v20M0 10h30" stroke="#fff" stroke-width="6"/><path d="M15 0v20M0 10h30" stroke="#C8102E" stroke-width="3.5"/>',
  ru: '<rect width="30" height="20" fill="#fff"/><rect y="6.7" width="30" height="6.7" fill="#0039A6"/><rect y="13.4" width="30" height="6.6" fill="#D52B1E"/>',
  az: '<rect width="30" height="20" fill="#509E2F"/><rect width="30" height="6.7" fill="#00B5E2"/><rect y="6.7" width="30" height="6.7" fill="#EF3340"/><circle cx="14" cy="10" r="2.6" fill="#fff"/><circle cx="14.9" cy="10" r="2.1" fill="#EF3340"/><circle cx="17.5" cy="10" r=".9" fill="#fff"/>',
  br: '<rect width="30" height="20" fill="#009C3B"/><path d="M15 2.5 27.5 10 15 17.5 2.5 10z" fill="#FFDF00"/><circle cx="15" cy="10" r="4.3" fill="#002776"/>',
  id: '<rect width="30" height="20" fill="#fff"/><rect width="30" height="10" fill="#E70011"/>',

  kz: '<rect width="30" height="20" fill="#00AFCA"/><circle cx="15" cy="9" r="3.8" fill="#FEC50C"/><path d="M9 16.5h12" stroke="#FEC50C" stroke-width="1.2"/>',
  tj: '<rect width="30" height="20" fill="#fff"/><rect width="30" height="5.7" fill="#CC0000"/><rect y="14.3" width="30" height="5.7" fill="#006600"/><circle cx="15" cy="10" r="1.8" fill="#F8C300"/>',
  tr: '<rect width="30" height="20" fill="#E30A17"/><circle cx="11.5" cy="10" r="5.2" fill="#fff"/><circle cx="12.9" cy="10" r="4.2" fill="#E30A17"/><circle cx="17.6" cy="10" r="1.5" fill="#fff"/>',
  ua: '<rect width="30" height="20" fill="#FFD700"/><rect width="30" height="10" fill="#0057B7"/>',
};
const flag = code => {
  const s = document.createElementNS(SVGNS, "svg");
  s.setAttribute("viewBox", "0 0 30 20"); s.setAttribute("class", "flag"); s.setAttribute("aria-hidden", "true");

};
const HTML_LANG = { ua: "uk", kz: "kk", kg: "ky", tj: "tg", br: "pt-BR" };

/* Swatch paint per theme (decorative only; the ids and names come from the server). */
const PV = {
  dossier: "--pv-bg:#101116;--pv-card:#F1E9DB;--pv-ink:#22201C;--pv-acc:#721F2B;--pv-r:4px;--pv-cr:2px;--pv-br:0;--pv-bd:1px solid #2A2C35;--pv-cbd:0;--pv-csh:none",
  neon: "--pv-bg:#07050F;--pv-card:#120E24;--pv-ink:#EAF2FF;--pv-acc:#FF2E93;--pv-r:6px;--pv-cr:4px;--pv-br:1px;--pv-bd:1px solid #1c1740;--pv-cbd:1px solid #00E5FF;--pv-csh:0 0 10px rgba(0,229,255,.55)",
  deco: "--pv-bg:#0A0908;--pv-card:#15120D;--pv-ink:#F2E6C9;--pv-acc:#C9A24B;--pv-r:0;--pv-cr:0;--pv-br:0;--pv-bd:1px solid #3a2f17;--pv-cbd:1px solid #C9A24B;--pv-csh:inset 0 0 0 2px #15120D,inset 0 0 0 3px rgba(201,162,75,.6)",
  day: "--pv-bg:#EEF1F6;--pv-card:#FFFFFF;--pv-ink:#131A26;--pv-acc:#3355E0;--pv-r:14px;--pv-cr:9px;--pv-br:5px;--pv-bd:1px solid #CBD3E1;--pv-cbd:0;--pv-csh:0 3px 8px rgba(16,24,40,.18)",
  comic: "--pv-bg:#E9E5D8;--pv-card:#FFFFFF;--pv-ink:#000;--pv-acc:#D00000;--pv-r:0;--pv-cr:0;--pv-br:0;--pv-bd:2px solid #000;--pv-cbd:2px solid #000;--pv-csh:3px 3px 0 #000",
};
const haptic = kind => { try { if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred(kind); } catch (e) { /* optional */ } };
const say = text => { try { if (tg && tg.showAlert) return tg.showAlert(text); } catch (e) { /* fall through */ } window.alert(text); };

async function api(path, body) {
  const headers = { "Authorization": "tma " + initDataNow() };
  const opts = body ? { method: "POST", headers: { ...headers, "Content-Type": "application/json" }, body: JSON.stringify(body) } : { headers };
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

/* Applies a theme now and recolours Telegram's own header and bottom bar to match it (if the SDK is there). */
function applyTheme(id) {
  if (!window.tmTheme(id)) return;
  const t = window.TM_THEMES[id];
  if (!tg) return;
  try {
    tg.setHeaderColor(t.bar); tg.setBackgroundColor(t.bar);
    if (tg.setBottomBarColor) tg.setBottomBarColor(t.bottom);
  } catch (e) { /* older clients */ }
}

function tabs(active) {
  const names = [["dossier", "app.tab_dossier"], ["roles", "app.tab_roles"], ["wanted", "app.tab_wanted"], ["log", "app.tab_log"], ["market", "app.tab_market"]];
  const nav = document.getElementById("tabs");
  nav.removeAttribute("aria-hidden");
  nav.replaceChildren(...names.map(([id, key]) =>
    el("button", { role: "tab", "data-id": id, "aria-selected": String(id === active), onclick: () => show(id) }, ic(id), S.strings[key])));
}
function show(id) {
  curTab = id;
  for (const b of document.querySelectorAll("nav.tabs button")) b.setAttribute("aria-selected", String(b.dataset.id === id));
  for (const s of document.querySelectorAll("section")) s.classList.toggle("on", s.id === id);
  window.scrollTo(0, 0);
}

/* ---- language picker: a custom listbox sheet (no native select element) ---- */
const langOpts = () => [...document.querySelectorAll("#langlist [role=option]")];
function langButtonKids(code) {
  return [flag(code), el("span", { class: "code" }, code.toUpperCase()), ic("chevron", "chev")];
}
function header() {
  const cur = S.languages.find(l => l.code === S.lang) || S.languages[0];
  const btn = el("button", { class: "lang-btn", id: "langbtn", type: "button", "aria-haspopup": "listbox", "aria-expanded": "false", "aria-controls": "langlist",
    "aria-label": `${S.strings["lang.title"]}: ${cur.name}`, onclick: () => (document.getElementById("langwrap").hidden ? openLang() : closeLang()) }, langButtonKids(cur.code));
  document.getElementById("head").replaceChildren(el("strong", {}, "TezMafia"), el("div", { class: "head-r" }, el("span", {}, S.case), btn));
}
function openLang() {
  const wrap = document.getElementById("langwrap");
  document.getElementById("langtitle").textContent = S.strings["lang.title"];
  document.getElementById("langclose").setAttribute("aria-label", S.strings["app.close"]);
  document.getElementById("langlist").replaceChildren(...S.languages.map(l => el("li", {
    role: "option", tabindex: "-1", "data-code": l.code, "aria-selected": String(l.code === S.lang), lang: HTML_LANG[l.code] || l.code,
    onclick: () => pickLang(l.code),
  }, flag(l.code), el("span", { class: "nm" }, l.name), ic("check", "ck"))));
  wrap.hidden = false;
  document.body.classList.add("lock");
  document.getElementById("langbtn").setAttribute("aria-expanded", "true");
  (langOpts().find(o => o.getAttribute("aria-selected") === "true") || langOpts()[0]).focus();
}
function closeLang(restoreFocus = true) {
  const wrap = document.getElementById("langwrap");
  if (wrap.hidden) return;
  wrap.hidden = true;
  document.body.classList.remove("lock");
  const b = document.getElementById("langbtn");
  if (b) { b.setAttribute("aria-expanded", "false"); if (restoreFocus) b.focus(); }
}
async function pickLang(code) {
  if (!S || code === S.lang) { closeLang(); return; }
  closeLang();
  const btn = document.getElementById("langbtn");
  if (btn) btn.replaceChildren(...langButtonKids(code));  /* instant feedback while the request runs */
  try {
    const r = await api("/api/lang", { lang: code });
    S = r.state; document.documentElement.lang = S.lang; render(curTab); haptic("success");
  } catch (e) { header(); say(S.strings["app.error"]); }
}
document.getElementById("langscrim").addEventListener("click", () => closeLang());
document.getElementById("langclose").addEventListener("click", () => closeLang());
document.getElementById("langwrap").addEventListener("keydown", e => {
  const opts = langOpts(), i = opts.indexOf(document.activeElement), n = opts.length;
  if (e.key === "Escape") { e.preventDefault(); closeLang(); }
  else if (e.key === "ArrowDown") { e.preventDefault(); opts[(i + 1) % n].focus(); }
  else if (e.key === "ArrowUp") { e.preventDefault(); opts[(i - 1 + n) % n].focus(); }
  else if (e.key === "Home") { e.preventDefault(); opts[0].focus(); }
  else if (e.key === "End") { e.preventDefault(); opts[n - 1].focus(); }
  else if ((e.key === "Enter" || e.key === " ") && i >= 0) { e.preventDefault(); pickLang(opts[i].dataset.code); }
  else if (e.key === "Tab") {  /* focus stays inside the sheet: options <-> close button */
    e.preventDefault();
    const close = document.getElementById("langclose");
    (document.activeElement === close ? opts[e.shiftKey ? n - 1 : 0] : close).focus();
  }
});

function customize() {
  const grid = el("div", { class: "swatches", role: "group", "aria-label": S.strings["theme.title"] },
    S.themes.map(th => el("button", { class: "swatch", type: "button", "data-theme-id": th.id, "aria-pressed": String(th.id === S.theme), onclick: () => pickTheme(th.id) },
      el("span", { class: "pv", style: PV[th.id] || "" }, el("i")), el("span", { class: "nm" }, ic("check", "ck"), th.name))));
  return el("article", { class: "sheet", id: "customize" }, h2("palette", S.strings["theme.title"]), el("p", { class: "note" }, S.strings["theme.hint"]), grid);
}
function markTheme(id) {
  for (const b of document.querySelectorAll(".swatch")) b.setAttribute("aria-pressed", String(b.dataset.themeId === id));
}
async function pickTheme(id) {
  if (id === S.theme) return;
  const before = S.theme;
  S.theme = id; applyTheme(id); markTheme(id);
  try { const r = await api("/api/theme", { theme: id }); S = r.state; haptic("success"); }
  catch (e) { S.theme = before; applyTheme(before); markTheme(before); say(S.strings["app.error"]); }
}

function dossier() {
  const p = S.profile, L = p.lines, span = Math.max(1, p.level_to - p.level_from);
  const filled = Math.round(10 * Math.min(1, Math.max(0, (p.xp - p.level_from) / span)));
  const portrait = (S.roles.items.find(r => r.key === "mafia") || {}).image || "";
  const stamp = el("div", { class: "stamp" + (stamped ? "" : " hit"), "aria-hidden": "true" }, S.strings["app.stamp"], el("b", {}, p.level));
  stamped = true;
  const field = (label, value, big, icon) => el("div", { class: "field" }, el("dt", {}, icon ? ic(icon) : "", label), el("dd", { class: big ? "big" : "" }, value));
  const xp = el("div", { class: "xp", role: "img", "aria-label": `${p.xp} / ${p.level_to} XP` },
    Array.from({ length: 10 }, (_, i) => el("i", { class: i < filled ? "on" : "" })));
  const card = el("article", { class: "sheet" }, stamp, el("div", { class: "dossier" },
    el("div", { class: "photo" }, el("img", { src: portrait, alt: "" })),
    el("dl", { class: "fields" },
      field(S.strings["app.field_name"], (p.badge ? p.badge + " " : "") + p.name + (p.title ? " · " + p.title : ""), true),
      el("div", { class: "field" }, el("dt", {}, ic("star"), S.strings["app.field_rank"]), el("dd", {}, `${p.level} · ${p.xp} / ${p.level_to} XP`), xp),
      field(S.strings["app.field_record"], L.record, false, "trophy"),
      field(S.strings["app.field_wallet"], L.purse, false, "coin"),
      field(S.strings["app.field_fair"], `${L.fair_score} / 100`, false, "shield"))));

  const d = S.daily;
  const daily = el("article", { class: "sheet" }, h2("gift", d.title), el("p", { class: "note" }, d.streak_text),
    d.claimed ? el("p", { class: "note" }, d.done) : act("", d.gem ? "gem" : "coin", d.button, claimDaily));

  const q = S.quests;
  const quests = el("article", { class: "sheet" }, h2("checks", q.title),
    q.items.map(x => el("div", { class: "task" + (x.done ? " done" : "") },
      el("span", { class: "box", "aria-hidden": "true" }, x.done ? ic("check") : ""), el("span", { class: "what" }, x.title), el("span", {}, `${x.progress}/${x.target}`))),
    el("p", { class: "note", style: "margin:12px 0 0" }, q.reward));

  const seals = el("article", { class: "sheet" }, h2("award", S.strings["app.seals"]), el("p", { class: "note" }, L.ach),
    el("div", { class: "seals" }, S.achievements.map(a => el("div", { class: "seal" + (a.unlocked ? "" : " off") }, a.title))));

  const admin = S.admin ? el("article", { class: "sheet" }, h2("chart", S.admin.title), S.admin.lines.map(x => el("p", { class: "note" }, x))) : "";
  return el("section", { id: "dossier" }, card, daily, quests, seals, customize(), admin);
}

function roles() {
  const dlg = document.getElementById("card");
  const open = r => {
    dlg.replaceChildren(el("article", { class: "sheet" }, el("img", { src: r.image, alt: "" }), el("h2", {}, r.title), el("p", {}, r.body),
      act("quiet", "x", S.strings["app.close"], () => dlg.close())));
    dlg.showModal();
  };
  return el("section", { id: "roles" }, el("p", { class: "intro" }, S.roles.intro),
    el("div", { class: "roles" }, S.roles.items.map(r => el("button", { class: "role side-" + r.side, onclick: () => open(r) },
      el("img", { src: r.image, alt: "", loading: "lazy" }), el("span", {}, r.title)))));
}

function board(rows, value, mark) {
  return el("ol", { class: "board" }, rows.map(r => el("li", { class: mark && mark(r) ? "me" : "" }, el("span", { class: "who" }, r.name), el("span", { class: "val" }, value(r)))));
}

function wanted() {
  const box = el("div");
  const draw = () => {
    const v = S.top[topView];
    box.replaceChildren(h2("trophy", v.title), v.rows.length ? board(v.rows, r => `${r.wins} / ${r.games}`) : el("p", { class: "note" }, S.strings["top.empty"]));
  };
  const seg = el("div", { class: "seg" }, [["season", "btn.top_season"], ["all", "btn.top_all"]].map(([k, key]) =>
    el("button", { type: "button", "aria-pressed": String(topView === k), onclick: e => {
      topView = k; for (const b of seg.children) b.setAttribute("aria-pressed", String(b === e.currentTarget)); draw();
    } }, S.strings[key])));
  draw();
  const t = S.tournament, c = S.clan;
  const tour = el("article", { class: "sheet" }, h2("flag", t.title), el("p", { class: "note" }, t.me),
    t.rows.length ? board(t.rows, r => r.points, r => r.me) : el("p", { class: "note" }, S.strings["top.empty"]));
  const clan = el("article", { class: "sheet" }, h2("users", c.title),
    c.mine ? [el("p", {}, el("b", {}, c.mine.name)), el("p", { class: "note" }, c.mine.line)] : el("p", { class: "note" }, c.none),
    c.top.length ? [el("h3", {}, c.top_title), board(c.top, r => [`${r.wins} · `, ic("users", "sm"), ` ${r.members}`])] : "");
  const rc = S.recruiters;
  const recruit = el("article", { class: "sheet" }, h2("userplus", rc.title),
    rc.rows.length ? board(rc.rows, r => r.n, r => r.me) : el("p", { class: "note" }, S.strings["top.recruit_empty"]));
  return el("section", { id: "wanted" }, el("article", { class: "sheet" }, seg, box), tour, recruit, clan);
}

function caseLog() {
  const pad = n => String(n).padStart(2, "0");
  const fmt = ts => { const d = new Date(ts * 1000); return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  return el("section", { id: "log" }, S.games.length ? S.games.map(g => el("article", { class: "sheet entry" + (g.won ? " won" : "") },
    el("header", {}, el("span", {}, fmt(g.at)), el("span", { class: "with-i" }, ic("users", "sm"), g.players)),
    el("h2", { style: "font-size:21px" }, g.result), g.you ? el("p", { class: "note" }, g.you) : "",
    el("ul", {}, g.events.map(e => el("li", {}, e)))))
    : el("article", { class: "sheet" }, el("p", {}, S.strings["chr.empty"])));
}

function market() {
  const p = S.profile;
  /* worn = check, owned = shirt (wear), not owned = cart (buy) */
  const wearIcon = k => (k.worn ? "check" : k.owned ? "shirt" : "cart");
  const stars = el("article", { class: "sheet" }, h2("star", S.strings["app.stars"]),
    S.shop.packs.map(x => act("", "cart", x.label, () => buy(x.key))),
    act("", "gem", S.shop.vip.label, () => buy("vip")),
    el("p", { class: "note", style: "margin-top:12px" }, S.strings["stars.vip_desc"]),
    el("p", { class: "note" }, S.strings["stars.note"]));
  const skins = el("article", { class: "sheet" }, h2("shirt", S.strings["skins.title"]), el("p", { class: "note" }, S.skins.body),
    S.skins.items.map(k => el("div", { class: "ware" }, el("img", { src: `/assets/raven/skins/${k.key}/mafia.jpg`, alt: "" }),
      act(k.worn ? "chosen" : "quiet", wearIcon(k), k.label, () => cosmetic("/api/skin", k.key)))),
    S.skins.worn ? act("quiet", "x", S.strings["btn.skin_off"], () => cosmetic("/api/skin", "off")) : "");
  const badges = el("article", { class: "sheet" }, h2("smile", S.strings["app.badges"]), el("p", { class: "note" }, S.gems_body),
    S.badges.map(b => act(b.worn ? "chosen" : "quiet", wearIcon(b), b.label, () => cosmetic("/api/badge", b.key))),
    p.badge ? act("quiet", "x", S.strings["btn.badge_off"], () => cosmetic("/api/badge", "off")) : "");
  return el("section", { id: "market" }, stars, skins, badges);
}

function render(active = curTab) {
  header();
  const root = document.getElementById("root");
  root.removeAttribute("aria-busy");
  root.replaceChildren(dossier(), roles(), wanted(), caseLog(), market());
  tabs(active); show(active);
}

async function claimDaily() {
  try { const r = await api("/api/daily", {}); S = r.state; render("dossier"); haptic(r.result === "claimed" ? "success" : "warning"); }
  catch (e) { say(S.strings["app.error"]); }
}
async function buy(product) {
  try {
    const { link } = await api("/api/invoice", { product });
    if (!tg || !tg.openInvoice) throw new Error("no Telegram SDK");
    tg.openInvoice(link, async status => { if (status === "paid") { say(S.strings["app.paid"]); await load("market"); } });
  } catch (e) { say(S.strings["app.error"]); }
}
async function cosmetic(path, key) {
  try {
    const r = await api(path, { key });
    S = r.state; render("market");
    if (r.result === "no_gems") say(S.strings["gems.no_gems"]); else haptic("success");
  } catch (e) { say(S.strings["app.error"]); }
}

/* The first load uses the fetch that started in <head>; later reloads go through api(). */
async function load(active, first) {
  try {
    if (first) {
      let early = window.tmState;
      if (!early) { await window.tmTg; early = window.tmFetch(initDataNow()); }  /* no hash data: wait for the SDK's initData */
      try { S = await early; }
      catch (e) { await window.tmTg; S = await window.tmFetch(initDataNow()); }  /* one retry with the SDK's own value */
    } else {
      S = await api("/api/state");
    }
    document.documentElement.lang = HTML_LANG[S.lang] || S.lang; applyTheme(S.theme); render(active);
  } catch (e) {
    const root = document.getElementById("root");
    root.removeAttribute("aria-busy");
    root.replaceChildren(el("p", { class: "err" }, ic("alert", "lg")));
  }
}

/* Telegram SDK: loaded async, so every use is guarded. ready() goes out once the skeleton has been painted. */
let sdkDone = false;
function initTg() {
  if (sdkDone) return;
  sdkDone = true;
  tg = (window.Telegram && window.Telegram.WebApp) || null;
  if (!tg) return;
  try { tg.ready(); tg.expand(); } catch (e) { /* ignore */ }
  applyTheme(document.documentElement.getAttribute("data-theme") || "dossier");
}
window.tmTg.then(() => { requestAnimationFrame(initTg); setTimeout(initTg, 250); });
load("dossier", true);
</script>
