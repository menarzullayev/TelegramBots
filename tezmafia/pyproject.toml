[project]
name = "tezmafia"
version = "1.0.0"
description = "Production Telegram Mafia bot (group + DM engine)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.31,<4",
  "aiosqlite>=0.22.1",
  "sqlalchemy[asyncio]>=2.1.8",
  "pydantic-settings>=2.16.2",
  "pydantic>=2.13.5",
  "pillow>=13.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.2.0", "pytest-asyncio>=1.5.0", "ruff>=0.17.5"]

[project.scripts]
tezmafia = "tezmafia.__main__:main"
tezmafia-qa = "tezmafia.qa_gate:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tezmafia*"]

[tool.setuptools.package-data]
tezmafia = ["locales/*.json", "legal_urls.json", "webapp/static/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["qa: JIRA QA board ticket", "discrepancy: engine behaviour that differs from or is not covered by the player-facing text (docs/RULES-VERIFICATION.md)"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Pyflakes, pycodestyle, import order, bugbear, pyupgrade; the rest of ruff's rules are opt-in later.
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
