<!doctype html>
<meta charset="utf-8">
<title>wordmark options</title>
<style>
  body { margin: 0; background: #101116; color: #F1E9DB; font: 14px Arial; }
  .opt { display: flex; align-items: center; gap: 28px; padding: 22px 36px; border-bottom: 1px solid #2A2C35; }
  .n { font: 700 22px Consolas, monospace; color: #C5A15A; width: 36px; }
  .mark { width: 96px; height: 96px; }
  .label { margin-left: auto; color: #9A958C; font: 13px Consolas, monospace; text-align: right; }
  .a { font-family: Georgia, serif; font-weight: 700; font-size: 64px; }
  .b { font-family: "Sitka Banner", "Sitka", Georgia, serif; font-weight: 600; font-size: 68px; }
  .c { font-family: Bahnschrift, sans-serif; font-weight: 600; font-stretch: 87.5%; font-size: 62px; letter-spacing: .06em; }
  .d { font-family: Bahnschrift, sans-serif; font-weight: 300; font-size: 52px; letter-spacing: .32em; }
  .red { color: #D9545C; } .gold { color: #C5A15A; }
</style>
